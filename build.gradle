plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '6.11.0'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.2.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(Javadoc) {
    failOnError false
    options.addStringOption('Xdoclint:none', '-quiet')
}

spotless {
    java {
        palantirJavaFormat()
    }
}

group = 'ai.apologist'
version = '1.1.0'

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()

    coordinates('ai.apologist', 'apologist', version.toString())

    pom {
        name = 'Apologist'
        description = 'Official Java client for the Apologist Agent API.'
        inceptionYear = '2025'
        url = 'https://github.com/apologist-project/apg-sdk-java'
        licenses {
            license {
                name = 'The MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'apologist'
                name = 'Apologist'
                url = 'https://apologist.ai'
            }
        }
        scm {
            url = 'https://github.com/apologist-project/apg-sdk-java'
            connection = 'scm:git:git://github.com/apologist-project/apg-sdk-java.git'
            developerConnection = 'scm:git:ssh://git@github.com/apologist-project/apg-sdk-java.git'
        }
    }
}
